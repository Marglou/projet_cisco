---
- name: Ensure suricata stack directory exists
  ansible.builtin.file:
    path: "{{ suricata_stack_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Suricata host log directory exists
  ansible.builtin.file:
    path: "{{ suricata_log_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Suricata rules directory exists
  ansible.builtin.file:
    path: "{{ suricata_stack_dir }}/rules"
    state: directory
    mode: '0755'

- name: Deploy Suricata compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ suricata_stack_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart suricata compose stack

- name: Deploy Suricata configuration override
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: "{{ suricata_stack_dir }}/suricata.yaml"
    mode: '0644'
  notify: Restart suricata compose stack

- name: Start Suricata compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ suricata_stack_dir }}"
    state: present

- name: Update Suricata rules in container
  ansible.builtin.command:
    argv: [docker, exec, "{{ suricata_container_name }}", suricata-update]
  register: suricata_update_result
  changed_when: suricata_update_result.rc == 0
