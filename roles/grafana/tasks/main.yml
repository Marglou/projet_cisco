---
- name: Ensure Grafana admin password is provided
  ansible.builtin.assert:
    that:
      - vault_grafana_admin_password is defined
      - vault_grafana_admin_password | length > 0
    fail_msg: >-
      Define vault_grafana_admin_password in an encrypted
      inventory/group_vars/monitoring.vault file.

- name: Ensure grafana stack directory exists
  become: true
  ansible.builtin.file:
    path: "{{ grafana_stack_dir }}"
    state: directory
    mode: '0755'

- name: Write grafana compose definition
  become: true
  ansible.builtin.copy:
    dest: "{{ grafana_stack_dir }}/docker-compose.yml"
    content: "{{ grafana_compose_yml }}"
    mode: '0644'

- name: Run grafana compose stack
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_stack_dir }}"
    state: present

- name: Open grafana port in UFW
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ grafana_port | string }}"
    proto: tcp
