---
docker_compose_user: "{{ ansible_user }}"
docker_compose_apt_keyring_dir: /etc/apt/keyrings
docker_compose_apt_key_path: /etc/apt/keyrings/docker.asc
docker_compose_apt_repo: >-
  deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
  https://download.docker.com/linux/ubuntu
  {{ ansible_distribution_release }} stable
docker_compose_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_compose_network: monitoring_net
