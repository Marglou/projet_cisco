---
- name: Ensure prometheus stack directory exists
  become: true
  ansible.builtin.file:
    path: "{{ prometheus_stack_dir }}"
    state: directory
    mode: '0755'

- name: Write prometheus compose definition
  become: true
  ansible.builtin.copy:
    dest: "{{ prometheus_stack_dir }}/docker-compose.yml"
    content: "{{ prometheus_compose_yml }}"
    mode: '0644'

- name: Run prometheus compose stack
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ prometheus_stack_dir }}"
    state: present

- name: Open prometheus port in UFW
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ prometheus_port | string }}"
    proto: tcp
