---
prometheus_stack_dir: "{{ docker_stacks_dir }}/prometheus"
prometheus_port: 9090
prometheus_compose_yml: |
  services:
    prometheus:
      image: prom/prometheus:latest
      restart: unless-stopped
      ports:
        - "{{ prometheus_port }}:9090"
      networks:
        - monitoring_net
  networks:
    monitoring_net:
      external: true
